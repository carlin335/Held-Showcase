<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title description">
  <title id="title">Held — Know what you hold</title>
  <desc id="description">Held product banner showing the Scan, Verify, Value, Collect workflow.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111f36"/>
      <stop offset="0.58" stop-color="#090f1f"/>
      <stop offset="1" stop-color="#070a13"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#45f1bd"/>
      <stop offset="1" stop-color="#46c8ff"/>
