    <text x="86" y="560" fill="#8f9caf" font-size="20" font-weight="600">Active iPhone prototype · Private implementation</text>
    <text x="1194" y="560" text-anchor="end" fill="#8f9caf" font-size="20" font-weight="600">Created by Carlin Jon Soorenian</text>
